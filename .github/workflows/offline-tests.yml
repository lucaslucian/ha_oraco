name: Offline validation
on:
  push:
  pull_request:
jobs:
  parsers-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4 pytest
      - run: python -m compileall -q custom_components/ha_oraco
      - run: python -m pytest -q tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/ha_oraco/frontend/ha-oraco-panel.js
