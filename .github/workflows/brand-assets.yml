name: Generate brand images

on:
  push:
    branches: [main]
    paths:
      - "devtools/generate_brand.py"
      - "assets/icon.svg"
      - "assets/logo.svg"
      - ".github/workflows/brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "CairoSVG>=2.7,<3" "Pillow>=11,<13"
      - run: python devtools/generate_brand.py
      - name: Commit generated brand PNGs
        run: |
          git add custom_components/ha_oraco/brand/*.png
          if git diff --cached --quiet; then
            echo "Brand PNGs already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets: regenerate HoraInfo brand PNGs"
          git push
